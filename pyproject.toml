[project]
name = "bt7274"
version = "0.2.0"
description = "Talk to BT-7274 from Titanfall 2 in your terminal, with his own voice."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.30",
    "piper-tts>=1.3",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "psutil>=5.9",
    "rich>=13",
]

[project.optional-dependencies]
# Speech input (push-to-talk). Kept optional because it pulls in a larger model runtime.
listen = ["faster-whisper>=1.1"]

[project.scripts]
bt = "bt7274.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.8,<0.20"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
